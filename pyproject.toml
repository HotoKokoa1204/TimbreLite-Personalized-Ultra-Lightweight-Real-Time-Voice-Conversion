[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timbre_lite"
version = "0.1.0"
description = "Personalized Ultra-Lightweight Real-Time Voice Conversion"
authors = [
    {name = "AGILAB NTNU", email = "mjhsu@ntnu.edu.tw"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "scipy>=1.10.0",
    "encodec>=0.1.1",
]

[project.optional-dependencies]
curation = [
    "av>=10.0.0",
    "transformers>=4.28.0",
    "huggingface_hub>=0.14.0",
    "tqdm>=4.60.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
lint.select = ["E", "F", "W", "I", "N"]
lint.ignore = []
lint.per-file-ignores = { "scripts/*.py" = ["E501"] }
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = [
    "build",
    "dist",
    ".venv",
]

[[tool.mypy.overrides]]
module = [
    "soundfile",
    "soundfile.*",
    "scipy",
    "scipy.*",
    "torchaudio",
    "torchaudio.*",
    "tqdm",
    "tqdm.*",
    "transformers",
    "transformers.*",
    "av",
    "av.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "librosa",
    "librosa.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

